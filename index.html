<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Sekolah</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link id="gf" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>

.gal{columns:3 220px;gap:14px}.gal img{margin-bottom:14px;border-radius:var(--r);cursor:zoom-in;width:100%}
.ct{display:grid;gap:12px}footer{background:#06182e;color:#cbd5e1;text-align:center;padding:40px 20px}footer a{color:var(--a);margin:0 8px;text-decoration:none}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:var(--c);color:var(--t)}
.box{background:var(--c);border-radius:var(--r);padding:22px;box-shadow:0 2px 12px #0001}

.mb{background:var(--c);color:var(--t);border-radius:var(--r);padding:26px;max-width:680px;width:100%;max-height:92vh;overflow:auto}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:#0f172a;color:#fff;padding:12px 22px;border-radius:99px;opacity:0;transition:.3s;z-index:200}#toast.on{opacity:1;transform:translate(-50%,0)}#toast.er{background:#b91c1c}
.nh .hero{display:none}.nh .hero+*{margin-top:72px}.nh #nav{background:var(--c);color:var(--h);box-shadow:0 2px 20px #0001}a.card{display:block;color:inherit;text-decoration:none}.lnk{display:inline-block;margin-top:10px;color:var(--a);font-weight:600}
.lay-modern #nav{inset:14px 0 auto}.lay-modern #nav .w{background:#ffffff1f;backdrop-filter:blur(14px);border-radius:99px;height:60px;padding:0 26px;max-width:1080px;border:1px solid #ffffff33}
.lay-modern #nav.s{background:none;box-shadow:none;backdrop-filter:none}.lay-modern #nav.s .w{background:var(--c);box-shadow:0 8px 30px #0002}

.lay-modern .card{box-shadow:none;border:1px solid #64748b30}
.lay-minimal .hero{height:68vh;min-height:440px}.lay-minimal .sl{align-items:flex-end;padding-bottom:64px}.lay-minimal .sl:before{background:linear-gradient(0deg,#000a,#0002)}
.lay-minimal section h2,.lay-minimal .sub{text-align:left}.lay-minimal .sub{margin-left:0}.lay-minimal section h2:after{margin-left:0;width:36px;height:2px}
.lay-minimal .card{box-shadow:none;border-radius:0;background:none;border-bottom:1px solid #64748b40}.lay-minimal .card:hover{transform:none;box-shadow:none}
.lay-minimal .card img,.lay-minimal .ph{border-radius:0;height:180px}.lay-minimal .st{background:none;color:var(--t);border-block:1px solid #64748b40}.lay-minimal .btn{border-radius:0}
.lay-majalah h1,.lay-majalah h2,.lay-majalah h3{text-transform:uppercase;letter-spacing:.04em}.lay-majalah .hero{height:78vh}.lay-majalah .sl{align-items:flex-end;padding-bottom:70px}
.lay-majalah .sl h1{max-width:900px;font-size:clamp(2.4rem,6vw,4.6rem)}.lay-majalah section h2{text-align:left;border-bottom:3px solid var(--h);padding-bottom:10px}
.lay-majalah section h2:after{display:none}.lay-majalah .sub{text-align:left;margin-left:0}.lay-majalah .card{border-radius:0;box-shadow:none;border:1px solid #64748b30}.lay-majalah .btn{border-radius:0}
.lay-kreatif .card{border:2px solid var(--h);box-shadow:6px 6px 0 var(--a)}.lay-kreatif .card:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--a)}
.lay-kreatif .btn{border:2px solid var(--h);box-shadow:4px 4px 0 var(--h)}.lay-kreatif section h2{display:table;margin:0 auto;background:var(--a);color:#fff;padding:6px 20px;transform:rotate(-1.5deg)}
.lay-kreatif section h2:after{display:none}.lay-kreatif .st{background:linear-gradient(135deg,var(--p),var(--a))}.lay-kreatif .st b{color:#fff}
.lay-kreatif .sl h1{font-size:clamp(2.6rem,6.5vw,5rem)}.lay-kreatif .ag{border:2px solid var(--h);box-shadow:5px 5px 0 var(--a)}
@media(min-width:801px){.lay-majalah #berita .grid{grid-template-columns:repeat(4,1fr)}.lay-majalah #berita .card:first-child{grid-column:span 2;grid-row:span 2}.lay-majalah #berita .card:first-child img,.lay-majalah #berita .card:first-child .ph{height:340px}
.lay-sidebar>:not(#nav){margin-left:250px}.lay-sidebar #nav,.lay-sidebar #nav.s{inset:0 auto 0 0;width:250px;background:var(--p);color:#fff;box-shadow:none}
.lay-sidebar #nav .w{flex-direction:column;align-items:flex-start;justify-content:flex-start;height:100%;padding:30px 22px;gap:26px}.lay-sidebar #nav nav{flex-direction:column;gap:8px}
.lay-sidebar #nav nav a{font-size:.95rem;padding:6px 0}.lay-sidebar.nh .hero+*{margin-top:0}}
.ft{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}.ft button{border:1px solid #64748b50;background:var(--c);color:var(--t);padding:8px 18px;border-radius:99px;cursor:pointer;font:600 .85rem var(--fb)}.ft button.on{background:var(--p);color:#fff;border-color:var(--p)}
.src{display:flex;align-items:center}.card .fav{width:16px!important;height:16px!important;border-radius:3px!important;margin-right:6px;flex:none}
.sb{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:56px;align-items:start}
.sb>img,.sb>.ph{width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:calc(var(--r)*1.4);box-shadow:0 20px 50px #0f3d6e30;position:sticky;top:96px}
.sbt h2{text-align:left;font-size:2.2rem}.sbi{margin-top:22px;max-width:68ch}.sbi p{margin-bottom:14px;text-align:justify;hyphens:auto}.sbn{margin-top:22px;padding-left:14px;border-left:3px solid var(--a)}
@media(max-width:800px){.sb{grid-template-columns:1fr;gap:28px}.sb>img,.sb>.ph{max-width:320px;margin:auto;position:static}}
@media(max-width:800px){#nav nav{display:none;position:absolute;top:72px;left:0;right:0;background:var(--c);flex-direction:column;padding:16px 20px}#nav nav.o{display:flex}#nav nav a{color:var(--h)}#mb{display:block}.two{grid-template-columns:1fr}section{padding:60px 0}}
</style></head><body>
<div id="site"><div class="load">Memuat…</div></div><div id="toast"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxhl4jQrdpwWK3IyOeUn7I4GRrxDI6Rhx3JsGcpg5wOGA9KVL2_3scokj8eNUmEHROyeQ/exec';
const IMG=u=>{u=String(u||'').trim();const m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&(?:amp;)?)?id=|thumbnail\?id=)([\w-]{20,})/)||u.match(/lh3\.googleusercontent\.com\/d\/([\w-]{20,})/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1600':u};
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),N=s=>E(s).replace(/\n/g,'<br>'),SU=u=>{u=IMG(u);return /^https?:\/\//.test(u)?E(u):''},L=u=>/^(https?:|#|mailto:|tel:)/.test(u)?E(u):'#',FN=x=>String(x).replace(/[^\w ]/g,'');
let D,T=sessionStorage.t||'',U=JSON.parse(sessionStorage.u||'null'),R=[],C='',UR=[];
const toast=(m,x)=>{const t=$('#toast');t.textContent=m;t.className='on'+(x?' er':'');clearTimeout(t.h);t.h=setTimeout(()=>t.className='',3500)};
async function api(a,p={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:a,token:T,...p})}),j=await r.json();if(!j.ok)throw Error(j.error);return j.data}
const go=f=>async(...a)=>{try{await f(...a)}catch(x){if(/Sesi/.test(x.message)&&T)out();toast(x.message,1)}};
const modal=h=>{const m=document.createElement('div');m.className='mo';m.innerHTML=`<div class="mb">${h}<p style="text-align:right;margin-top:16px"><button class="btn2" onclick="this.closest('.mo').remove()">Tutup</button></p></div>`;m.onclick=e=>e.target==m&&m.remove();document.body.appendChild(m)};
/* ===== PUBLIK ===== */
const ph=(u,c='')=>SU(u)?`<img src="${SU(u)}" alt="" loading="lazy" class="${c}">`:`<div class="ph ${c}"></div>`;
const sec=(id,t,sb,b,c='')=>`<section id="${id}" class="${c}"><div class="w"><h2>${E(D.pengaturan['judul_'+id]||t)}</h2><p class="sub">${E(D.pengaturan['sub_'+id]||sb)}</p>${b}</div></section>`;
const MP=v=>{v=String(v||'');const m=v.match(/src\s*=\s*["']([^"']+)["']/i),u=(m?m[1]:v).trim().replace(/&amp;/g,'&');return /^https:\/\/(www\.)?google\.[a-z.]+\/maps\/embed/i.test(u)||/^https:\/\/maps\.google\.[a-z.]+\/maps\?.*output=embed/i.test(u)?u:''};
const DEF={nama_sekolah:'Nama Sekolah',gaya_sudut:'sedang',tema_layout:'klasik',gaya_halaman:'',judul_program:'Program dan Inovasi',judul_aplikasi:'Aplikasi Sekolah',tagline:'',warna_utama:'#0f3d6e',warna_aksen:'#c9a24b',warna_latar:'#f8fafc',font_judul:'Playfair Display',font_isi:'Inter',hero_judul:'Selamat Datang',hero_subjudul:'',tentang_judul:'Tentang Sekolah',tentang_isi:'',visi:'',misi:'',sambutan_isi:'',alamat:'',jam_operasional:'',maps_embed:'',footer_teks:'',logo:'',telepon:'',email:''};
async function load(){try{const c=new AbortController,t=setTimeout(()=>c.abort(),30000);let r;try{r=await fetch(API+'?action=getPublic',{signal:c.signal})}finally{clearTimeout(t)}
const tx=await r.text();let j;try{j=JSON.parse(tx)}catch(e){throw Error('Server tidak mengembalikan data JSON. Pastikan Web App di-deploy dengan akses "Anyone" dan memakai versi terbaru.')}
if(!j.ok)throw Error(j.error);D=j.data;D.pengaturan={...DEF,...(D.pengaturan||{})};['menu','slider','program','fasilitas','guru','berita','galeri','prestasi','agenda','halaman','aplikasi'].forEach(k=>D[k]=D[k]||[]);render()}
catch(x){const m=/Failed to fetch|abort/i.test(x.message)?'Tidak bisa terhubung ke server. Buka halaman ini dari hosting (mis. GitHub Pages) atau file langsung di browser, bukan dari pratinjau/preview.':x.message;
$('#site').innerHTML=`<div class="load"><p>Gagal memuat data:<br><b>${E(m)}</b></p><p style="margin:16px"><button class="btn" onclick="location.reload()">Coba Lagi</button></p><p><small>Jika masih gagal: jalankan <b>setup()</b> di Apps Script, lalu Deploy › Manage deployments › Edit › New version (akses: Anyone).</small></p><p style="margin-top:12px"><a href="#admin">Buka Admin</a></p></div>`}}
function render(){
const s=D.pengaturan,on=k=>s['show_'+k]!=='N',st=document.documentElement.style;
st.setProperty('--p',s.warna_utama);st.setProperty('--a',s.warna_aksen);st.setProperty('--bg',s.warna_latar);
st.setProperty('--fh',`'${FN(s.font_judul)}',serif`);st.setProperty('--fb',`'${FN(s.font_isi)}',sans-serif`);
$('#gf').href='https://fonts.googleapis.com/css2?family='+[s.font_judul,s.font_isi].map(f=>FN(f).replace(/ /g,'+')+':wght@400;500;600;700').join('&family=')+'&display=swap';
const hx=c=>{c=String(c||'').replace('#','');if(c.length==3)c=c.replace(/./g,'$&$&');return[0,2,4].map(i=>parseInt(c.substr(i,2),16)||0)},mix=(a,b,t)=>'#'+hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*t).toString(16).padStart(2,'0')).join(''),dk=(c=>{const[r,g,b]=hx(c);return(.299*r+.587*g+.114*b)/255<.45})(s.warna_latar);
st.setProperty('--r',{tajam:'4px',sedang:'14px',bulat:'28px'}[s.gaya_sudut]||'14px');st.setProperty('--t',dk?'#e2e8f0':'#1e293b');st.setProperty('--c',dk?mix(s.warna_latar,'#ffffff',.08):'#ffffff');st.setProperty('--h',dk?'#ffffff':s.warna_utama);st.setProperty('--tn',dk?mix(s.warna_latar,'#ffffff',.04):mix(s.warna_latar,s.warna_utama,.06));
document.title=s.nama_sekolah+' - '+s.tagline;
const CD=(u,i)=>u&&L(u)!='#'?`<a class="card" href="${L(u)}" target="_blank" rel="noopener">${i}</a>`:`<div class="card">${i}</div>`;
const S=(k,id,t,sb,f)=>on(k)&&D[k].length?sec(id,t,sb,`<div class="grid">${D[k].map(f).join('')}</div>`):'';
const sl=D.slider.length?D.slider:[{judul:s.hero_judul,subjudul:s.hero_subjudul,gambar:s.hero_gambar}];
let h=`<header id="nav"><div class="w"><a class="lg" href="#beranda">${SU(s.logo)?`<img src="${SU(s.logo)}" alt="">`:''}<span>${E(s.nama_sekolah)}</span></a><button id="mb" onclick="$('#nav nav').classList.toggle('o')">☰</button><nav onclick="this.classList.remove('o')">${D.menu.map(m=>`<a href="${L(m.link)}">${E(m.label)}</a>`).join('')}</nav></div></header>
<div class="hero" id="beranda">${sl.map((x,i)=>`<div class="sl${i?'':' on'}">${SU(x.gambar)?`<img src="${SU(x.gambar)}" alt="">`:''}<div class="w"><h1>${E(x.judul)}</h1><p>${E(x.subjudul)}</p>${x.tombol_teks?`<a class="btn" href="${L(x.tombol_link)}">${E(x.tombol_teks)}</a>`:''}</div></div>`).join('')}</div>`;
if(on('statistik'))h+=`<div class="st"><div class="w grid">${[1,2,3,4].map(i=>`<div><b>${E(s['stat'+i+'_nilai'])}</b>${E(s['stat'+i+'_label'])}</div>`).join('')}</div></div>`;
if(on('tentang'))h+=sec('tentang',s.tentang_judul,[s.npsn&&'NPSN '+s.npsn,s.akreditasi&&'Akreditasi '+s.akreditasi].filter(Boolean).join(' · '),`<div class="two">${ph(s.tentang_gambar,'rd')}<div><p>${N(s.tentang_isi)}</p><h3 style="margin-top:20px">Visi</h3><p>${N(s.visi)}</p><h3 style="margin-top:20px">Misi</h3><ul class="ms">${s.misi.split('\n').filter(Boolean).map(x=>`<li>${E(x)}</li>`).join('')}</ul></div></div>`);
if(on('sambutan'))h+=`<section class="tint"><div class="w sb">${ph(s.sambutan_foto)}<div class="sbt"><h2>${E(s.judul_sambutan||'Sambutan')}</h2><div class="sbi">${s.sambutan_isi.split('\n').filter(Boolean).map(x=>`<p>${E(x)}</p>`).join('')}</div><p class="sbn"><b>${E(s.sambutan_nama)}</b><br><small>${E(s.sambutan_jabatan)}</small></p></div></div></section>`;
h+=S('program','program',s.judul_program,'Karya dan terobosan sekolah',p=>CD(p.link,`${SU(p.gambar)?ph(p.gambar):`<div class="ic">${E(p.ikon||'★')}</div>`}<div><h3>${E(p.judul)}</h3><p>${E(p.deskripsi)}</p>${p.link?'<span class="lnk">Kunjungi →</span>':''}</div>`));
h+=S('aplikasi','aplikasi',s.judul_aplikasi,'Layanan digital untuk warga sekolah',a=>CD(a.link,`${SU(a.gambar)?ph(a.gambar):`<div class="ic">${E(a.ikon||'📱')}</div>`}<div><h3>${E(a.nama)}</h3><p>${E(a.deskripsi)}</p>${a.link?'<span class="lnk">Buka aplikasi →</span>':''}</div>`));
h+=S('fasilitas','fasilitas','Fasilitas','Sarana penunjang belajar',f=>`<div class="card">${ph(f.gambar)}<div><h3>${E(f.nama)}</h3><p>${E(f.deskripsi)}</p></div></div>`);
h+=S('guru','guru','Guru & Tenaga Pendidik','Pendidik profesional dan berdedikasi',g=>`<div class="card">${ph(g.foto)}<div><h3>${E(g.nama)}</h3><small>${E(g.jabatan)}${g.mapel?' · '+E(g.mapel):''}</small></div></div>`);
const BN=b=>{if(b.tipe!='online')return`<div class="card" data-t="m" style="cursor:pointer" onclick="news('${E(b.id)}')">${ph(b.gambar)}<div><small>${E(b.tanggal)} · ${E(b.kategori)}</small><h3>${E(b.judul)}</h3><p>${E(b.ringkasan)}</p></div></div>`;
let fh='';try{fh=new URL(b.link).hostname}catch(e){}
